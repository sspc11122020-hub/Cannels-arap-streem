name: Ultimate Channels Scraper

on:
  schedule:
    - cron: '0 0 * * *' # يتم التحديث تلقائياً يومياً في منتصف الليل
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          npm init -y
          npm install axios

      - name: Run Smart Scraper
        run: node scraper.js

      - name: Commit and Push Sorted JSONs
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "تحديث وتصنيف ملفات القنوات تلقائياً"
          file_pattern: 'Arabic/*.json Global/*.json'
