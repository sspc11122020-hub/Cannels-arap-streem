name: Chann Scraper & Updater

on:
  schedule:
    - cron: '0 0 * * *' # يتم التشغيل يومياً في منتصف الليل
  workflow_dispatch: # زر التشغيل اليدوي من GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          npm init -y
          npm install axios

      - name: Run Scraper Script
        run: node scraper.js

      - name: Commit and Push Generated JSONs
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "تحديث ملفات القنوات (chann) تلقائياً"
          file_pattern: 'chann/*.json'
