name: DaddyLive Channels Scraper

on:
  schedule:
    - cron: '0 0 * * *' # يعمل تلقائياً كل يوم في منتصف الليل
  workflow_dispatch: # يتيح لك تشغيله يدوياً من واجهة GitHub

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          npm init -y
          npm install puppeteer

      - name: Run Puppeteer Scraper
        run: node scraper.js

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "تحديث روابط القنوات تلقائياً"
          file_pattern: 'Arabic/*.json Global/*.json'
